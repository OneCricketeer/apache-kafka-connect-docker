name: Release Docker Images

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  release:
    if: github.repository == 'OneCricketeer/apache-kafka-connect-docker'
    runs-on: ubuntu-26.04
    env:
      BUILDX_PLATFORMS: linux/amd64,linux/arm64
      GIT_REVISION: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate tag
        id: tag
        uses: ./.github/actions/validate-release-tag
        with:
          prefix: v

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      # Images are tagged from the POM version, so it must agree with the git tag
      - name: Check POM version matches tag
        env:
          TAG_VERSION: ${{ steps.tag.outputs.version }}
        run: |
          POM_VERSION="$(./mvnw -B org.apache.maven.plugins:maven-help-plugin:3.5.2:evaluate -Dexpression=project.version -q -DforceStdout)"
          if [[ "${POM_VERSION}" != "${TAG_VERSION}" ]]; then
            echo "::error::pom.xml version '${POM_VERSION}' does not match tag version '${TAG_VERSION}'."
            exit 1
          fi

      - name: Test
        run: ./mvnw -B --errors verify

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: cricketeerone
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          platforms: ${{ env.BUILDX_PLATFORMS }}

      - name: Build & Push - Alpine
        run: make buildx-confluent-hub-alpine

      - name: Build & Push - Ubuntu
        run: make
