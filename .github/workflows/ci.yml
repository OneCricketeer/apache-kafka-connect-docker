# Lints and tests only; nothing is pushed or released from this workflow.
# Releases are handled by docker-release.yml and helm-release.yml on SemVer tags from main.
#
# Repeated values are YAML anchors (&name), defined at first use and reused as aliases (*name).
# Merge keys (<<) are not supported by GitHub Actions, so only whole values and steps are shared.

name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  maven:
    runs-on: &runner ubuntu-26.04
    steps:
      - &checkout
        uses: actions/checkout@v7

      - &setup-jdk
        name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Test
        run: ./mvnw -B --errors verify

  docker:
    name: docker (${{ matrix.arch }})
    # Native runner per architecture, so every released platform is built and scanned
    runs-on: ${{ matrix.runner }}
    needs: maven
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: *runner
          - arch: arm64
            runner: ubuntu-26.04-arm
    env:
      # Enables the buildx targets; without push they build the native platform only
      BUILDX_PLATFORMS: linux/amd64,linux/arm64
      BUILDX_DO_PUSH: 0
      # Build into the local Docker daemon only (no push)
      MVN_BUILD_CMD: compile jib:dockerBuild
      GIT_REVISION: ${{ github.sha }}
    steps:
      - *checkout

      - *setup-jdk

      # 'docker' driver so buildx reads the Jib base images from, and loads results into, the local daemon
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver: docker

      - name: Build - Alpine
        run: make buildx-confluent-hub-alpine

      - name: Build - Ubuntu
        run: make buildx-confluent-hub

      - name: Verify image architecture
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          for tag in alpine-confluent-hub latest-confluent-hub; do
            actual="$(docker image inspect -f '{{.Architecture}}' "cricketeerone/apache-kafka-connect:${tag}")"
            if [[ "${actual}" != "${ARCH}" ]]; then
              echo "::error::Image ${tag} is ${actual}, expected ${ARCH}."
              exit 1
            fi
          done

      # Report HIGH and above, but only fail on fixable CRITICAL vulnerabilities
      - name: Trivy report - Alpine
        uses: &trivy-action aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: &alpine-image cricketeerone/apache-kafka-connect:alpine-confluent-hub
          severity: &report-severity HIGH,CRITICAL
          ignore-unfixed: true
          # Installs Trivy for the later steps, which skip setup
          version: &trivy-version v0.76.2

      - name: Trivy report - Ubuntu
        uses: *trivy-action
        with:
          image-ref: &ubuntu-image cricketeerone/apache-kafka-connect:latest-confluent-hub
          severity: *report-severity
          ignore-unfixed: true
          skip-setup-trivy: true

      - name: Trivy gate - Alpine
        uses: *trivy-action
        with:
          image-ref: *alpine-image
          severity: &gate-severity CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          skip-setup-trivy: true

      - name: Trivy gate - Ubuntu
        uses: *trivy-action
        with:
          image-ref: *ubuntu-image
          severity: *gate-severity
          ignore-unfixed: true
          exit-code: '1'
          skip-setup-trivy: true

  helm:
    runs-on: *runner
    env:
      # Required chart values, so Trivy can render the templates
      TRIVY_HELM_SET: bootstrapServers=kafka:9092,groupId=connect
    steps:
      - *checkout

      - name: Set up Helm
        uses: azure/setup-helm@v5

      - name: Lint Helm Chart
        run: helm lint ./chart

      - name: Install Helm unittest plugin
        run: |
          if ! helm plugin list | grep -q "unittest"; then
            helm plugin install https://github.com/helm-unittest/helm-unittest --verify=false
          fi

      - name: Run Helm unit tests
        run: helm unittest ./chart

      # Report HIGH and above, but only fail on CRITICAL misconfigurations
      - name: Trivy report - Helm Chart
        uses: *trivy-action
        with:
          scan-type: config
          scan-ref: ./chart
          severity: *report-severity
          version: *trivy-version

      - name: Trivy gate - Helm Chart
        uses: *trivy-action
        with:
          scan-type: config
          scan-ref: ./chart
          severity: *gate-severity
          exit-code: '1'
          skip-setup-trivy: true
