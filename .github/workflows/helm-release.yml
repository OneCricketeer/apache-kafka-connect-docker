name: Release Helm Chart

on:
  pull_request:
  push:
    branches:
      - '**'
    tags:
      - 'helm/v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check if tag is on main
        id: release_check
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" != "tag" ]]; then
            echo "release_allowed=false" >> "$GITHUB_OUTPUT"
            echo "Not a tag push; lint only."
            exit 0
          fi

          TAG="${GITHUB_REF_NAME}"
          git fetch origin main --depth=1
          TAG_COMMIT="$(git rev-list -n 1 "${TAG}")"

          if git merge-base --is-ancestor "${TAG_COMMIT}" origin/main; then
            echo "release_allowed=true" >> "$GITHUB_OUTPUT"
            echo "Tag ${TAG} is on main; releasing chart."
          else
            echo "release_allowed=false" >> "$GITHUB_OUTPUT"
            echo "Tag ${TAG} is not on main; lint only."
          fi

      - name: Set up Helm
        uses: azure/setup-helm@v5

      - name: Lint Helm Chart
        run: |
          helm lint ./chart

      - name: Install Helm unittest plugin
        run: |
          if ! helm plugin list | grep -q "unittest"; then
            helm plugin install https://github.com/helm-unittest/helm-unittest
          fi

      - name: Run Helm unit tests
        run: |
          helm unittest ./chart

      - name: Validate SemVer and Set Chart Version
        if: steps.release_check.outputs.release_allowed == 'true'
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#helm/v}"

          echo "Extracted version: ${VERSION} from tag: ${TAG}"

          SEMVER_REGEX="^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-((0|[1-9][0-9]*|[0-9]*[a-zA-Z-][0-9a-zA-Z-]*)(\.(0|[1-9][0-9]*|[0-9]*[a-zA-Z-][0-9a-zA-Z-]*))*))?(\+([0-9a-zA-Z-]+(\.[0-9a-zA-Z-]+)*))?$"

          if [[ ! "${VERSION}" =~ ${SEMVER_REGEX} ]]; then
            echo "::error::Version '${VERSION}' is not a valid Semantic Version (SemVer)."
            exit 1
          fi

          echo "Setting version in ./chart/Chart.yaml to ${VERSION}"
          sed -i -E "s/^version:.*/version: ${VERSION}/" ./chart/Chart.yaml
          grep -E "^version:" ./chart/Chart.yaml

      - name: Log in to GitHub Container Registry (GHCR)
        if: steps.release_check.outputs.release_allowed == 'true'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io --username "${{ github.actor }}" --password-stdin

      - name: Package Helm Chart
        if: steps.release_check.outputs.release_allowed == 'true'
        run: |
          mkdir -p .cr-release-packages
          helm package ./chart --destination .cr-release-packages

      - name: Publish Helm Chart to GHCR
        if: steps.release_check.outputs.release_allowed == 'true'
        run: |
          OWNER_LOWER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          for pkg in .cr-release-packages/*.tgz; do
            if [ -f "${pkg}" ]; then
              echo "Publishing ${pkg} to oci://ghcr.io/${OWNER_LOWER}..."
              helm push "${pkg}" "oci://ghcr.io/${OWNER_LOWER}"
            fi
          done

      - name: Generate Release Notes
        if: steps.release_check.outputs.release_allowed == 'true'
        run: |
          PREV_TAG=$(git tag -l "helm/v*" --sort=-v:refname | grep -v "^${GITHUB_REF_NAME}$" | head -n 1)
          if [ -n "${PREV_TAG}" ]; then
            git log "${PREV_TAG}..HEAD" --pretty=format:"* %s (%h)" -- chart/ > RELEASE_NOTES.md
          else
            git log --pretty=format:"* %s (%h)" -- chart/ > RELEASE_NOTES.md
          fi
          if [ ! -s RELEASE_NOTES.md ]; then
            echo "* Helm chart release ${GITHUB_REF_NAME}" > RELEASE_NOTES.md
          fi

      - name: Release Helm Chart to GitHub Releases
        if: steps.release_check.outputs.release_allowed == 'true'
        uses: softprops/action-gh-release@v3
        with:
          files: .cr-release-packages/*.tgz
          body_path: RELEASE_NOTES.md

