name: Release Helm Chart

on:
  push:
    tags:
      - 'helm/v*'

jobs:
  release:
    runs-on: ubuntu-26.04
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate tag
        id: tag
        uses: ./.github/actions/validate-release-tag
        with:
          prefix: helm/v

      - name: Set up Helm
        uses: azure/setup-helm@v5

      - name: Lint Helm Chart
        run: |
          helm lint ./chart

      - name: Install Helm unittest plugin
        run: |
          if ! helm plugin list | grep -q "unittest"; then
            helm plugin install https://github.com/helm-unittest/helm-unittest --verify=false
          fi

      - name: Run Helm unit tests
        run: |
          helm unittest ./chart

      - name: Trivy scan - Helm Chart
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          # Required chart values, so Trivy can render the templates
          TRIVY_HELM_SET: bootstrapServers=kafka:9092,groupId=connect
        with:
          scan-type: config
          scan-ref: ./chart
          severity: CRITICAL
          exit-code: '1'

      - name: Set Chart Version
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          echo "Setting version in ./chart/Chart.yaml to ${VERSION}"
          sed -i -E "s/^version:.*/version: ${VERSION}/" ./chart/Chart.yaml
          grep -E "^version:" ./chart/Chart.yaml

      - name: Log in to GitHub Container Registry (GHCR)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "${GITHUB_TOKEN}" | helm registry login ghcr.io --username "${{ github.actor }}" --password-stdin

      - name: Package Helm Chart
        run: |
          mkdir -p .cr-release-packages
          helm package ./chart --destination .cr-release-packages

      - name: Publish Helm Chart to GHCR
        run: |
          OWNER_LOWER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          for pkg in .cr-release-packages/*.tgz; do
            if [ -f "${pkg}" ]; then
              echo "Publishing ${pkg} to oci://ghcr.io/${OWNER_LOWER}..."
              helm push "${pkg}" "oci://ghcr.io/${OWNER_LOWER}"
            fi
          done

      - name: Generate Release Notes
        run: |
          PREV_TAG=$(git tag -l "helm/v*" --sort=-v:refname | grep -v "^${GITHUB_REF_NAME}$" | head -n 1)
          if [ -n "${PREV_TAG}" ]; then
            git log "${PREV_TAG}..HEAD" --pretty=format:"* %s (%h)" -- chart/ > RELEASE_NOTES.md
          else
            git log --pretty=format:"* %s (%h)" -- chart/ > RELEASE_NOTES.md
          fi
          if [ ! -s RELEASE_NOTES.md ]; then
            echo "* Helm chart release ${GITHUB_REF_NAME}" > RELEASE_NOTES.md
          fi

      - name: Release Helm Chart to GitHub Releases
        uses: softprops/action-gh-release@v3
        with:
          files: .cr-release-packages/*.tgz
          body_path: RELEASE_NOTES.md
